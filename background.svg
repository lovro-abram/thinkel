<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8E6C9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF9C4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
        <feGaussianBlur stdDeviation="10" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#skyGradient)" />

  <!-- Sun -->
  <circle cx="450" cy="330" r="20" fill="#FFFFF0" />

  <!-- Distant Mountains -->
  <path d="M 0 450 L 150 350 L 300 420 L 450 320 L 600 380 L 800 350 L 800 600 L 0 600 Z" fill="#A5D6A7" opacity="0.6" />

  <!-- Mid Mountains -->
  <path d="M 0 500 L 200 380 L 400 450 L 550 360 L 700 430 L 800 400 L 800 600 L 0 600 Z" fill="#81C784" opacity="0.7" />

  <!-- Lake -->
  <path d="M 250 450 L 550 450 L 650 480 L 150 480 Z" fill="#455A64" opacity="0.4" />

  <!-- Near Mountains -->
  <path d="M -50 600 L 100 420 L 250 500 L 400 430 L 550 520 L 750 410 L 850 600 Z" fill="#4CAF50" />

  <!-- Trees Silhouette -->
  <g fill="#1B5E20">
    <!-- Row of trees -->
    <path d="M 10 600 L 25 550 L 40 600 Z M 30 600 L 50 530 L 70 600 Z M 60 600 L 85 540 L 110 600 Z M 100 600 L 130 520 L 160 600 Z M 150 600 L 180 540 L 210 600 Z M 200 600 L 240 510 L 280 600 Z M 270 600 L 310 530 L 350 600 Z M 340 600 L 380 500 L 420 600 Z M 410 600 L 450 540 L 490 600 Z M 480 600 L 530 510 L 580 600 Z M 570 600 L 620 540 L 670 600 Z M 660 600 L 720 520 L 780 600 Z M 770 600 L 810 550 L 850 600 Z" />
    <!-- Another row -->
    <path d="M -10 600 L 15 570 L 40 600 Z M 40 600 L 70 560 L 100 600 Z M 90 600 L 120 575 L 150 600 Z M 140 600 L 180 555 L 220 600 Z M 210 600 L 260 565 L 310 600 Z M 300 600 L 350 550 L 400 600 Z M 390 600 L 440 570 L 490 600 Z M 480 600 L 540 560 L 600 600 Z M 590 600 L 650 575 L 710 600 Z M 700 600 L 770 565 L 840 600 Z" opacity="0.8" />
  </g>
</svg>
