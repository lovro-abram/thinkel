<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F1F6EC">
    <title>404 – Thinkel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='27' height='27' rx='6' fill='%231CA85E'/%3E%3Crect x='5' y='1' width='27' height='27' rx='6' fill='%23FFFFFF' stroke='%2312291A' stroke-width='2'/%3E%3Ctext x='18' y='21' font-size='15' font-family='Arial Black,Arial,sans-serif' font-weight='900' text-anchor='middle' fill='%2312291A'%3ET%3C/text%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F1F6EC;
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
            color: #12291A;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border: 3px solid #12291A;
            border-radius: 18px;
            box-shadow: 8px 8px 0 0 #12291A;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .code {
            font-family: 'Archivo Black', system-ui, sans-serif;
            font-size: 4rem;
            color: #0E7A3C;
            line-height: 1;
        }
        .tile {
            display: inline-block;
            background: #1CA85E;
            border-radius: 10px;
            width: 42px;
            height: 42px;
            margin-bottom: 18px;
        }
        h1 { font-family: 'Archivo Black', system-ui, sans-serif; font-size: 1.3rem; text-transform: uppercase; margin: 18px 0 10px; }
        p { color: #52685A; line-height: 1.55; margin-bottom: 28px; }
        a {
            display: inline-block;
            background: #1CA85E;
            color: #FFFFFF;
            border: 3px solid #12291A;
            border-radius: 12px;
            box-shadow: 4px 4px 0 0 #12291A;
            padding: 12px 26px;
            font-weight: 700;
            text-decoration: none;
        }
        a:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 #12291A; }
    </style>
</head>
<body>
    <main class="card">
        <span class="tile" aria-hidden="true"></span>
        <div class="code">404</div>
        <h1 id="nf-h1">Page not found</h1>
        <p id="nf-p">This page does not exist.</p>
        <a href="/" id="nf-btn">Back to Thinkel</a>
    </main>
    <script>
    /* Same language logic as the app (js/app.js resolveInitialLang):
       saved choice > browser language. No switcher on this page. */
    (function () {
        'use strict';
        var lang = 'en';
        try {
            var saved = localStorage.getItem('lang');
            if (saved === 'sl' || saved === 'en') {
                lang = saved;
            } else {
                var nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
                lang = String(nav).toLowerCase().indexOf('sl') === 0 ? 'sl' : 'en';
            }
        } catch (e) { /* private mode / file:// — stay EN */ }
        var t = lang === 'sl'
            ? { h1: 'Stran ne obstaja', p: 'Stran, ki jo iščeš, ne obstaja.', btn: 'Nazaj na Thinkel' }
            : { h1: 'Page not found', p: 'This page does not exist.', btn: 'Back to Thinkel' };
        document.documentElement.lang = lang;
        document.getElementById('nf-h1').textContent = t.h1;
        document.getElementById('nf-p').textContent = t.p;
        document.getElementById('nf-btn').textContent = t.btn;
    })();
    </script>
</body>
</html>
