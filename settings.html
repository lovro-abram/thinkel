<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F1F6EC">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='27' height='27' rx='6' fill='%231CA85E'/%3E%3Crect x='5' y='1' width='27' height='27' rx='6' fill='%23FFFFFF' stroke='%2312291A' stroke-width='2'/%3E%3Ctext x='18' y='21' font-size='15' font-family='Arial Black,Arial,sans-serif' font-weight='900' text-anchor='middle' fill='%2312291A'%3ET%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <title>Settings | Nastavitve – Thinkel</title>
    <meta name="description" content="Thinkel app settings: font size, language, wallpaper editor, backup. | Nastavitve aplikacije Thinkel: velikost pisave, jezik, urejevalnik ozadij, varnostna kopija.">
    <meta name="robots" content="noindex, follow">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Thinkel">
    <meta property="og:url" content="https://thinkel.labram.workers.dev/settings.html">
    <meta property="og:title" content="Settings | Nastavitve – Thinkel">
    <meta property="og:description" content="Thinkel app settings. | Nastavitve aplikacije Thinkel.">
    <meta property="og:image" content="https://thinkel.labram.workers.dev/og-image.png">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="sl_SI">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body data-page="settings">

    <div id="app-container">
        <header>
            <h1>Thinkel</h1>
        </header>

        <main>
            <h2 style="margin-top:0; font-size: 1.4rem; color: var(--gold); font-family: var(--font-display); font-weight: 400; text-transform: uppercase;" data-i18n="settings">Settings</h2>
            
            <div id="install-pwa-btn" class="card" style="display: none; align-items: center; justify-content: space-between; border-color: var(--green); padding: 20px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span class="material-icons-round" style="color: var(--accent-color); font-size: 32px;">download_for_offline</span>
                    <div>
                        <div style="font-weight: 700; color: var(--text-primary);" data-i18n="pwa_install_title">Download App</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);" data-i18n="pwa_install_desc">Use Thinkel anywhere, even offline.</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="installPWA()" style="width: auto; padding: 10px 20px;" data-i18n="pwa_install_btn">Install</button>
            </div>

            <div class="card">
                <div class="setting-item">
                    <label class="setting-label" data-i18n="font_size">Font Size</label>
                    <div class="segment-control" id="font-control">
                        <div class="segment-pill"></div>
                        <div class="segment-opt" data-value="small" onclick="changeFontSize('small')" data-i18n="small">Small</div>
                        <div class="segment-opt" data-value="medium" onclick="changeFontSize('medium')" data-i18n="medium">Medium</div>
                        <div class="segment-opt" data-value="large" onclick="changeFontSize('large')" data-i18n="large">Large</div>
                    </div>
                </div>

                <div class="setting-item">
                    <label class="setting-label" data-i18n="language">Language</label>
                    <div class="segment-control" id="lang-control">
                        <div class="segment-pill"></div>
                        <div class="segment-opt" data-value="sl" onclick="changeLanguage('sl')">Slovenščina</div>
                        <div class="segment-opt" data-value="en" onclick="changeLanguage('en')">English</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="setting-item">
                    <span class="setting-label" data-i18n="wallpaper_editor">Wallpaper Editor</span>
                    <div class="setting-control">
                        <a href="wallpaper.html" class="btn btn-primary" style="text-decoration: none;">
                            <span class="material-icons-round">wallpaper</span>
                            <span data-i18n="open_wallpaper">Open Editor</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="setting-item">
                    <span class="setting-label" data-i18n="backup">Backup Data</span>
                    <div class="setting-control">
                        <button class="btn btn-primary" onclick="exportBackup()" data-i18n="download_backup">Download Backup</button>
                    </div>
                </div>
                <div class="setting-item" style="border-bottom: none;">
                    <span class="setting-label" data-i18n="restore">Restore Backup</span>
                    <div class="setting-control">
                        <input type="file" id="restore-file" accept=".thinkel,.json" onchange="importBackup(this)">
                        <label for="restore-file" class="btn btn-secondary" data-i18n="restore">Restore Backup</label>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <span class="nav-quote-icon">❞</span>
                <span data-i18n="nav_today">Home</span>
            </a>
            <a href="saved.html" class="nav-item">
                <span class="material-icons-round">bookmark</span>
                <span data-i18n="nav_saved">Saved</span>
            </a>
            <a href="settings.html" class="nav-item active">
                <span class="material-icons-round">settings</span>
                <span data-i18n="nav_settings">Settings</span>
            </a>
        </nav>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <span class="material-icons-round toast-icon">check_circle</span>
        <span id="toast-message">Message</span>
    </div>

    <script src="js/app.js?v=9"></script>
    <script>
        // Initialize settings page
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            updateTexts();
            requestAnimationFrame(() => {
                updateControlUI('font-control', localStorage.getItem('fontSize') || 'medium');
                updateControlUI('lang-control', localStorage.getItem('lang') || 'en');
            });
        });
    </script>
</body>
</html>
